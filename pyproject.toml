[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "printing-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "argon2-cffi>=23,<26", "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7", "pypdfium2>=4.30,<6", "pillow>=11,<13", "tzdata>=2025",
]

[project.optional-dependencies]
windows = ["pywin32>=308; sys_platform == 'win32'"]
dev = ["httpx>=0.28,<1", "ruff>=0.12,<1"]

[project.scripts]
platform-admin = "print_platform.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]
