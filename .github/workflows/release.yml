name: Version release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !github.event.deleted }}
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid version tag' }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-build.lock
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run build
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.lock -r requirements-build.lock
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python -m pip install . --no-deps
      - name: Check Python
        run: python -m ruff check backend scripts/smoke.py scripts/release-entry.py scripts/test_deployment.py
      - name: Verify updater
        shell: pwsh
        run: |
          python scripts/test_deployment.py
          if ($LASTEXITCODE -ne 0) { throw 'Deployment helper tests failed' }
          ./scripts/test-update.ps1
      - name: Build and verify portable package
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version $env:RELEASE_TAG
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath var/releases -File | ForEach-Object FullName)
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG, '--verify-tag', '--generate-notes', '--title', $env:RELEASE_TAG)
          if ($env:RELEASE_TAG.Contains('-')) { $releaseArgs += '--prerelease' }
          gh @releaseArgs @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed' }
